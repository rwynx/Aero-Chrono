<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <linearGradient id="focusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3ba9ea"/>
      <stop offset="100%" stop-color="#0c6bb5"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#147fd4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer reticle ring -->
  <circle cx="8" cy="8" r="6.2" fill="none" stroke="url(#focusGrad)" stroke-width="1.3"/>
  <!-- Inner focus target -->
  <circle cx="8" cy="8" r="3.2" fill="url(#centerGlow)" stroke="#0c6bb5" stroke-width="1"/>
  <circle cx="8" cy="8" r="1.3" fill="#005596"/>
  <!-- Crosshair ticks -->
  <line x1="8" y1="0.6" x2="8" y2="2.6" stroke="#1679c2" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="8" y1="13.4" x2="8" y2="15.4" stroke="#1679c2" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="0.6" y1="8" x2="2.6" y2="8" stroke="#1679c2" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="13.4" y1="8" x2="15.4" y2="8" stroke="#1679c2" stroke-width="1.2" stroke-linecap="round"/>
</svg>
